name: Kernel CL — KCL-1 substrate qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/kernel-cl
    paths:
      - "experiments/kernel_cl/**"
      - "tests/test_kernel_cl_kcl1.py"
      - "docs/research/kernel-continual-learning/kcl0-kcl1-protocol.md"
      - ".github/workflows/kernel-cl-kcl1.yml"

permissions:
  contents: read

jobs:
  kcl1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.10.0" "numpy==2.3.3" "pytest==8.4.2"

      - name: Unit tests
        run: python -m pytest tests/test_kernel_cl_kcl1.py -q

      - name: Frozen one-shot KCL-1 qualification
        run: |
          python experiments/kernel_cl/kcl1_substrate.py \
            --output experiments/kernel_cl/results/kcl1_summary.json

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcl1-evidence
          path: experiments/kernel_cl/results/kcl1_summary.json
          if-no-files-found: error
