name: Model Pipeline M2 Trainer Checkpoint QA

on:
  workflow_dispatch:
  push:
    branches:
      - docs/evidence-model-training-pipeline
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m0.py'
      - 'tests/test_model_pipeline_m1.py'
      - 'tests/test_model_pipeline_m2_unit.py'
      - 'requirements-pipeline-m0.txt'
      - 'requirements-pipeline-m1.txt'
      - 'requirements-pipeline-m2.txt'
      - 'docs/model-training-pipeline/**'
      - '.github/workflows/model-pipeline-m2.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m0.py'
      - 'tests/test_model_pipeline_m1.py'
      - 'tests/test_model_pipeline_m2_unit.py'
      - 'requirements-pipeline-m2.txt'
      - 'docs/model-training-pipeline/**'

jobs:
  m2-real-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Disk before install
        run: df -h
      - name: Install pinned M2 dependencies
        run: python -m pip install -r requirements-pipeline-m2.txt
      - name: M0 regression
        run: python -m pytest -q tests/test_model_pipeline_m0.py
      - name: M1 regression
        run: python -m pytest -q tests/test_model_pipeline_m1.py
      - name: M2 checkpoint unit tests
        run: python -m pytest -q tests/test_model_pipeline_m2_unit.py
      - name: Pinned Qwen two-phase interruption/resume qualification
        run: |
          python -m pipeline trainer-qualify             -c docs/model-training-pipeline/examples/end_to_end_small.yaml             --workspace .             --runs-root .m2-runs             --json
      - name: Disk after qualification
        if: always()
        run: df -h
