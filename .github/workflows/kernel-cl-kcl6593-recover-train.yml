name: Kernel CL — recover canonical KCL-6.5.9.3 train evidence

on:
  workflow_dispatch:
  push:
    branches:
      - research/kernel-cl
    paths:
      - .github/workflows/kernel-cl-kcl6593-recover-train.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Replay exact canonical scientific source
        run: |
          git checkout --detach 04cb560a9532e173892fa2e22c7cd3c4612ae2f7
          test ! -e .github/workflows/kernel-cl-kcl6593-validate.yml
          PYTHONPATH=. python experiments/kernel_cl/kcl6593_action_identifiability.py \
            --phase train \
            --output experiments/kernel_cl/results/kcl6593_train.json \
            --rule experiments/kernel_cl/results/kcl6593_rule.json

      - name: Verify exact canonical bytes from first scientific execution
        run: |
          echo "d97b8ae97fedfbc31fe5d04772134dcc41dc02b3d26938bb6b8576f6a5ec3aa5  experiments/kernel_cl/results/kcl6593_train.json" | sha256sum -c -
          echo "ef8ba7bd06c3d749926c671a92d99a875e2fe243787e3b80cf44f2ba411768ac  experiments/kernel_cl/results/kcl6593_rule.json" | sha256sum -c -
          cp experiments/kernel_cl/results/kcl6593_train.json /tmp/kcl6593_train.json
          cp experiments/kernel_cl/results/kcl6593_rule.json /tmp/kcl6593_rule.json

      - name: Commit exact recovered evidence onto current branch
        run: |
          git fetch origin research/kernel-cl
          git checkout -B research/kernel-cl origin/research/kernel-cl
          test ! -e .github/workflows/kernel-cl-kcl6593-validate.yml
          mkdir -p experiments/kernel_cl/results
          cp /tmp/kcl6593_train.json experiments/kernel_cl/results/kcl6593_train.json
          cp /tmp/kcl6593_rule.json experiments/kernel_cl/results/kcl6593_rule.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/kernel_cl/results/kcl6593_train.json experiments/kernel_cl/results/kcl6593_rule.json
          git commit -m "evidence(kcl): recover canonical KCL-6.5.9.3 train freeze"
          git push origin HEAD:research/kernel-cl

      - name: Upload recovered canonical evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcl6593-canonical-train-recovery
          path: |
            experiments/kernel_cl/results/kcl6593_train.json
            experiments/kernel_cl/results/kcl6593_rule.json
          if-no-files-found: error
