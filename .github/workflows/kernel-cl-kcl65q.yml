name: Kernel CL — KCL-6.5-Q specificity qualification

on:
  workflow_dispatch:
  push:
    branches:
      - research/kernel-cl
    paths:
      - experiments/kernel_cl/kcl65q_specificity_qualification.py
      - tests/test_kernel_cl_kcl65q.py
      - .github/workflows/kernel-cl-kcl65q.yml

permissions:
  contents: read

jobs:
  kcl65q:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.3 pytest==8.4.2
      - name: Qualification unit tests
        run: PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl65q.py -q
      - name: KCL-6.5-Q qualification
        id: qualification
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python experiments/kernel_cl/kcl65q_specificity_qualification.py \
            --output experiments/kernel_cl/results/kcl65q_summary.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcl65q-evidence
          path: experiments/kernel_cl/results/kcl65q_summary.json
          if-no-files-found: error
      - name: Enforce qualification PASS
        run: test "${{ steps.qualification.outputs.exit_code }}" -eq 0
