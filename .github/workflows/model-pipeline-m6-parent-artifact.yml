name: Model Pipeline M6 Parent Artifact Zero-Science

on:
  push:
    branches:
      - research/model-pipeline-m6-ollama
    paths:
      - 'tools/m6_parent_artifact_materialize.py'
      - 'tests/test_m6_parent_artifact_materialization.py'
      - 'artifacts/model-training-pipeline/m6/parent_artifact/PREREGISTRATION.json'
      - 'artifacts/model-training-pipeline/m6/parent_artifact/IMPLEMENTATION_AUTHORIZATION.json'
      - '.github/workflows/model-pipeline-m6-parent-artifact.yml'
  workflow_dispatch:

jobs:
  zero-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency only
        run: python -m pip install pytest==8.4.2

      - name: Parent-artifact zero-science tests
        run: python -m pytest -q tests/test_m6_parent_artifact_materialization.py

      - name: Generate planning-only recovery report
        run: |
          set -o pipefail
          python tools/m6_parent_artifact_materialize.py --json | tee parent-artifact-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("parent-artifact-plan.json").read_text())
          assert data["schema"] == "mindforge-m6-parent-artifact-materialization-plan-v1"
          assert data["reconstruction"]["authorized_now"] is False
          assert data["reconstruction"]["requires_separate_execution_authorization"] is True
          assert data["boundaries"]["q4_scientific_status"] == "PASS_CLOSED"
          assert data["boundaries"]["q4_rerun_authorized"] is False
          assert data["boundaries"]["fixture_evaluation_authorized"] is False
          assert data["boundaries"]["model_inference_authorized"] is False
          assert data["boundaries"]["scientific_adjudication_authorized"] is False
          assert data["boundaries"]["ollama_create_authorized"] is False
          assert data["boundaries"]["ollama_chat_authorized"] is False
          PY

      - name: Prove no materialization or reconstruction execution
        run: |
          test ! -f model-q4_k_m.gguf
          test ! -f model-f16.gguf
          test ! -f artifacts/model-training-pipeline/m6/parent_artifact/EXECUTION_AUTHORIZATION.json
          echo "existing_bytes_persisted=false"
          echo "quantizer_executed=false"
          echo "fixture_evaluation_executed=false"
          echo "model_inference_executed=false"
          echo "scientific_adjudication_executed=false"
          echo "ollama_create_executed=false"
          echo "ollama_chat_executed=false"

      - name: Upload planning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-parent-artifact-zero-science
          path: parent-artifact-plan.json
          if-no-files-found: ignore
