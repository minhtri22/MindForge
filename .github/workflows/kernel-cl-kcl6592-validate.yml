name: Kernel CL — KCL-6.5.9.2 regime predictor validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/kernel-cl
    paths:
      - .github/workflows/kernel-cl-kcl6592-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify frozen Phase-A artifacts
        run: |
          echo "a243ec57d7e9f28f361597eb0a25da1ec2373f2f06458b9a3c73bd618021b89b  experiments/kernel_cl/results/kcl6592_rule.json" | sha256sum -c -
          echo "295bcae868e7989481e38c24eb87b007d8fa1afb98b15854b2fc5d006982d66e  experiments/kernel_cl/results/kcl6592_train.json" | sha256sum -c -
          python - <<'PY'
          import json
          r=json.load(open("experiments/kernel_cl/results/kcl6592_rule.json"))
          assert r["status"] == "FROZEN_FROM_TRAIN_ONLY"
          assert r["source_git_commit"] == "9d1db04afde8fb4adf354ca45e1c82ae1c4a676e"
          assert r["governance"]["validation_executed_before_freeze"] is False
          assert r["governance"]["protected_confirmatory_touched"] is False
          assert r["governance"]["controller_implemented"] is False
          assert r["governance"]["kcl7_started"] is False
          assert len(r["validation_seeds"]) == 120
          PY

      - name: Focused contract tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl6592.py -q
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl6591.py -q

      - name: Assert no prior validation evidence is tracked
        run: |
          test ! -e experiments/kernel_cl/results/kcl6592_validation.json

      - name: Frozen validation without refit
        id: scientific
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python experiments/kernel_cl/kcl6592_regime_predictability.py \
            --phase validate \
            --rule experiments/kernel_cl/results/kcl6592_rule.json \
            --output experiments/kernel_cl/results/kcl6592_validation.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

          test -f experiments/kernel_cl/results/kcl6592_validation.json
          sha256sum experiments/kernel_cl/results/kcl6592_validation.json
          python - <<'PY'
          import json
          p="experiments/kernel_cl/results/kcl6592_validation.json"
          d=json.load(open(p))
          print("KCL6592_STATUS="+str(d.get("status")))
          print("KCL6592_VERDICT="+str(d.get("verdict")))
          print("KCL6592_SUPPORT="+json.dumps(d.get("support",{}),sort_keys=True))
          print("KCL6592_RPQ="+json.dumps(d.get("RPQ_V1",{}),sort_keys=True))
          print("KCL6592_BASELINES="+json.dumps(d.get("baselines",{}),sort_keys=True))
          print("KCL6592_BOOTSTRAP="+json.dumps(d.get("bootstrap_95pct",{}),sort_keys=True))
          print("KCL6592_QUALIFICATION="+json.dumps(d.get("qualification",{}),sort_keys=True))
          print("KCL6592_INTEGRITY="+json.dumps(d.get("integrity",{}),sort_keys=True))
          print("KCL6592_RULE="+json.dumps(d.get("rule",{}),sort_keys=True))
          PY

      - name: Enforce scope guardrails
        run: |
          test ! -e experiments/kernel_cl/results/kcl6592_controller.json
          test ! -e .github/workflows/kernel-cl-kcl6592-controller.yml
          test ! -e .github/workflows/kernel-cl-kcl7.yml

      - name: Upload canonical validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcl6592-regime-predictability-validation
          path: experiments/kernel_cl/results/kcl6592_validation.json
          if-no-files-found: error

      - name: Enforce valid scientific execution
        run: test "${{ steps.scientific.outputs.exit_code }}" -eq 0
