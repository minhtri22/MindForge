name: CPRM — CPRM-1 zero-science preflight

on:
  workflow_dispatch:
  push:
    branches:
      - research/continual-policy-response
    paths:
      - docs/research/continual-policy-response/cprm1-response-support-protocol.md
      - docs/research/continual-policy-response/CPRM1_EXECUTION_LOCK.json
      - experiments/cprm/**
      - tests/test_cprm1_response_support.py
      - .github/workflows/cprm1-zero-science-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install exact locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Focused synthetic / contract tests
        run: PYTHONPATH=. python -m pytest tests/test_cprm1_response_support.py -q

      - name: Run zero-science preflight under execution lock
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python experiments/cprm/cprm1_response_support.py             --phase preflight             --output artifacts/cprm1_zero_science_preflight.json

      - name: Enforce zero-science result
        run: |
          python - <<'PY'
          import json
          p="artifacts/cprm1_zero_science_preflight.json"
          d=json.load(open(p, encoding="utf-8"))
          assert d["status"] == "PASS", d
          assert d["verdict"] == "CPRM1_ZERO_SCIENCE_PREFLIGHT_PASS", d
          assert d["fresh_seed_execution_attempted"] is False, d
          assert d["scientific_outcome_generated"] is False, d
          assert d["model_fitting_performed"] is False, d
          assert d["checks"]["fresh_execution_not_authorized_yet"], d
          assert d["checks"]["independent_lock_verification_absent"], d
          assert d["seed_manifest"]["valid"], d
          print("CPRM1_ZERO_SCIENCE_PREFLIGHT=PASS")
          PY
          sha256sum artifacts/cprm1_zero_science_preflight.json
          sha256sum docs/research/continual-policy-response/CPRM1_EXECUTION_LOCK.json
          sha256sum docs/research/continual-policy-response/cprm1-response-support-protocol.md

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: cprm1-zero-science-preflight
          path: artifacts/cprm1_zero_science_preflight.json
          if-no-files-found: error
