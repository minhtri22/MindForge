name: Model Pipeline M3 Governance QA

on:
  workflow_dispatch:
  push:
    branches:
      - docs/evidence-model-training-pipeline
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m0.py'
      - 'tests/test_model_pipeline_m1.py'
      - 'tests/test_model_pipeline_m3.py'
      - 'tests/fixtures/m3_eval_v1/**'
      - 'requirements-pipeline-m0.txt'
      - 'requirements-pipeline-m1.txt'
      - 'requirements-pipeline-m3.txt'
      - 'docs/model-training-pipeline/**'
      - '.github/workflows/model-pipeline-m3.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m3.py'
      - 'tests/fixtures/m3_eval_v1/**'
      - 'requirements-pipeline-m3.txt'
      - 'docs/model-training-pipeline/**'

jobs:
  m3-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M3 dependencies
        run: python -m pip install -r requirements-pipeline-m3.txt
      - name: M0 regression
        run: python -m pytest -q tests/test_model_pipeline_m0.py
      - name: M1 regression
        run: python -m pytest -q tests/test_model_pipeline_m1.py
      - name: M3 governance unit and adversarial tests
        run: python -m pytest -q tests/test_model_pipeline_m3.py
      - name: M3 fixture-scale qualification
        run: |
          python -m pipeline governance-qualify             -c docs/model-training-pipeline/examples/m3_governance_fixture.yaml             --workspace .             --runs-root .m3-runs             --json
