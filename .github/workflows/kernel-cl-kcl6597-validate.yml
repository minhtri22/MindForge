name: Kernel CL — KCL-6.5.9.7 TRIG validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/kernel-cl
    paths:
      - .github/workflows/kernel-cl-kcl6597-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify frozen train/rule/source contract
        run: |
          echo "0d5c11464da578dc91857e455c339b8ab38a840971282b16f44f605fcfed5fb8  experiments/kernel_cl/results/kcl6597_train.json" | sha256sum -c -
          echo "a1895894e34437dae889e2dbf8290b2f67f431acfbee018c5fc59dc43f4664f1  experiments/kernel_cl/results/kcl6597_rule.json" | sha256sum -c -
          echo "2a153b60198283df14277f99d8cf434123c66b1b6ef66c83196ecee67a7a20d3  docs/research/kernel-continual-learning/kcl6597-protocol.md" | sha256sum -c -
          echo "89dcbb0c14cd1a3a5cbe9d51eb510e6f2741d0518c5dd72e3cfb629d528659c6  experiments/kernel_cl/kcl6597_temporal_mechanistic_representation.py" | sha256sum -c -
          python - <<'PY'
          import json
          d=json.load(open("experiments/kernel_cl/results/kcl6597_train.json"))
          r=json.load(open("experiments/kernel_cl/results/kcl6597_rule.json"))
          assert d["status"] == "PASS"
          assert d["verdict"] == "TRIG_V1_MODELS_TRAINED_AND_READY_TO_FREEZE"
          assert d["rule"]["sha256"] == "a1895894e34437dae889e2dbf8290b2f67f431acfbee018c5fc59dc43f4664f1"
          assert d["governance"]["validation_executed"] is False
          assert d["governance"]["protected_confirmatory_touched"] is False
          assert d["governance"]["controller_implemented"] is False
          assert d["governance"]["kcl7_started"] is False
          assert r["rule"] == "TRIG-Q-v1"
          assert r["source_git_commit"] == "237ff72b677255d7ce5a0ea297ff6c02eaef83ef"
          assert r["validation_executed_before_freeze"] is False
          assert r["protected_confirmatory_touched"] is False
          assert r["controller_implemented"] is False
          assert r["kcl7_started"] is False
          PY

      - name: Focused pre-validation contracts
        run: |
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl6597.py -q
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl6596.py -q

      - name: Assert validation evidence absent
        run: |
          test ! -e experiments/kernel_cl/results/kcl6597_validation.json

      - name: Frozen TRIG validation
        id: science
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python experiments/kernel_cl/kcl6597_temporal_mechanistic_representation.py \
            --phase validate \
            --rule experiments/kernel_cl/results/kcl6597_rule.json \
            --output experiments/kernel_cl/results/kcl6597_validation.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

          test -f experiments/kernel_cl/results/kcl6597_validation.json
          sha256sum experiments/kernel_cl/results/kcl6597_validation.json
          python - <<'PY'
          import json
          d=json.load(open("experiments/kernel_cl/results/kcl6597_validation.json"))
          print("KCL6597_VALIDATION_STATUS="+str(d.get("status")))
          print("KCL6597_VALIDATION_VERDICT="+str(d.get("verdict")))
          print("KCL6597_VALIDATION_SUPPORT="+json.dumps(d.get("support",{}),sort_keys=True))
          print("KCL6597_VALIDATION_INTEGRITY="+json.dumps(d.get("integrity",{}),sort_keys=True))
          print("KCL6597_PRIMARY="+json.dumps(d.get("primary",{}),sort_keys=True))
          print("KCL6597_BOOTSTRAP_DELTAS="+json.dumps(d.get("bootstrap",{}).get("deltas",{}),sort_keys=True))
          print("KCL6597_METRICS="+json.dumps(d.get("metrics",{}),sort_keys=True))
          print("KCL6597_SECONDARY="+json.dumps(d.get("secondary_diagnostics",{}),sort_keys=True))
          print("KCL6597_TRIG_SUMMARY="+json.dumps(d.get("trig_feature_summary",{}),sort_keys=True))
          PY

      - name: Enforce scope guardrails
        run: |
          test ! -e experiments/kernel_cl/results/kcl6597_controller.json
          test ! -e .github/workflows/kernel-cl-kcl6597-controller.yml
          test ! -e .github/workflows/kernel-cl-kcl7.yml

      - name: Preserve exact validation evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/kernel_cl/results/kcl6597_validation.json
          git commit -m "evidence(kcl): preserve KCL-6.5.9.7 validation"
          git push origin HEAD:research/kernel-cl

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcl6597-trig-validation
          path: experiments/kernel_cl/results/kcl6597_validation.json
          if-no-files-found: error

      - name: Enforce valid scientific execution
        run: test "${{ steps.science.outputs.exit_code }}" -eq 0
