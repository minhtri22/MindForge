name: Model Pipeline M1 Data Plane QA

on:
  workflow_dispatch:
  push:
    branches:
      - docs/evidence-model-training-pipeline
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m0.py'
      - 'tests/test_model_pipeline_m1.py'
      - 'requirements-pipeline-m0.txt'
      - 'requirements-pipeline-m1.txt'
      - 'docs/model-training-pipeline/**'
      - '.github/workflows/model-pipeline-m1.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m0.py'
      - 'tests/test_model_pipeline_m1.py'
      - 'requirements-pipeline-m0.txt'
      - 'requirements-pipeline-m1.txt'
      - 'docs/model-training-pipeline/**'

jobs:
  m1-zero-training:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M1 dependencies
        run: python -m pip install -r requirements-pipeline-m1.txt
      - name: M0 regression suite
        run: python -m pytest -q tests/test_model_pipeline_m0.py
      - name: M1 data-plane unit and integration suite
        run: python -m pytest -q tests/test_model_pipeline_m1.py
      - name: M1 zero-training qualification
        run: |
          python -m pipeline data-qualify             -c docs/model-training-pipeline/examples/end_to_end_small.yaml             --workspace .             --runs-root .m1-runs             --json
