name: MK1 H1a Confirmatory Preflight

permissions:
  contents: read

on:
  push:
    branches:
      - research/model_core
    paths:
      - "model_kernel/mk1/H1A_CONFIRMATORY_PREFLIGHT_TRIGGER_v0.1.md"

jobs:
  zero-pristine-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Verify preflight trigger
        run: |
          grep -q 'TRIGGER_H1A_CONFIRMATORY_PREFLIGHT_v0.1' model_kernel/mk1/H1A_CONFIRMATORY_PREFLIGHT_TRIGGER_v0.1.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen-compatible test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.2 tokenizers==0.21.4 psutil==7.2.2 pytest==9.0.2
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Compile evaluator
        run: |
          python -m py_compile experiments/model_core/mk1/h1a_confirmatory.py

      - name: Run fixture-only evaluator tests
        run: |
          pytest -q tests/test_model_core_mk1_h1a_confirmatory.py

      - name: Static no-training no-later-hypothesis scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'train_arm(' experiments/model_core/mk1/h1a_confirmatory.py
          ! grep -q 'optimizer.step(' experiments/model_core/mk1/h1a_confirmatory.py
          ! grep -q '\.backward(' experiments/model_core/mk1/h1a_confirmatory.py
          ! grep -q 'paired_h1b_bootstrap(' experiments/model_core/mk1/h1a_confirmatory.py
          ! grep -q 'h1c_common_field_summary(' experiments/model_core/mk1/h1a_confirmatory.py
          ! grep -q 'h1c_whole_scene_bootstrap(' experiments/model_core/mk1/h1a_confirmatory.py

