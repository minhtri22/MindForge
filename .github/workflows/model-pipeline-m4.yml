name: Model Pipeline M4 Reasoning Layers QA

on:
  workflow_dispatch:
  push:
    branches:
      - docs/evidence-model-training-pipeline
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m4.py'
      - 'requirements-pipeline-m4.txt'
      - 'docs/model-training-pipeline/**'
      - '.github/workflows/model-pipeline-m4.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'tests/test_model_pipeline_m4.py'
      - 'requirements-pipeline-m4.txt'
      - 'docs/model-training-pipeline/**'

jobs:
  m4-reasoning:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M4 tokenizer-only dependencies
        run: python -m pip install -r requirements-pipeline-m4.txt
      - name: M0 regression
        run: python -m pytest -q tests/test_model_pipeline_m0.py
      - name: M1 regression
        run: python -m pytest -q tests/test_model_pipeline_m1.py
      - name: M3 governance regression
        run: python -m pytest -q tests/test_model_pipeline_m3.py
      - name: M4 reasoning serializer/parser tests
        run: python -m pytest -q tests/test_model_pipeline_m4.py
      - name: Exact pinned-tokenizer M4 qualification
        run: |
          python -m pipeline reasoning-qualify             -c docs/model-training-pipeline/examples/end_to_end_small.yaml             --workspace .             --runs-root .m4-runs             --json
