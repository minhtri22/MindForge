name: CLRM — CLRM-1 zero-science preflight

on:
  workflow_dispatch:
  push:
    branches:
      - research/continual-loss-response
    paths:
      - docs/research/continual-loss-response/CLRM1_EXECUTION_LOCK.json
      - .github/workflows/clrm1-zero-science-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install exact locked runtime
        run: |
          python -m pip install pip==26.2.1
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Enforce pre-science repository state
        run: |
          test ! -e experiments/clrm/results/clrm1_role_s_responses.json
          test ! -e experiments/clrm/results/CLRM1_FORMAL_RESULT.json
          test ! -e docs/research/continual-loss-response/CLRM1_EXECUTION_LOCK_VERIFICATION.md
          test ! -e .github/workflows/clrm1-locked-execute.yml

      - name: Run CLRM-1 static and synthetic tests
        run: PYTHONPATH=. python -m pytest tests/test_clrm1_loss_response_support.py -q

      - name: Run zero-science historical extraction preflight
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python experiments/clrm/clrm1_loss_response_support.py             --phase preflight             --output artifacts/clrm1_zero_science_preflight.json

      - name: Enforce zero-science invariants
        run: |
          python - <<'PY'
          import json
          p="artifacts/clrm1_zero_science_preflight.json"
          d=json.load(open(p,encoding="utf-8"))
          assert d["status"]=="PASS", d
          assert d["verdict"]=="CLRM1_ZERO_SCIENCE_PREFLIGHT_PASS", d
          assert d["seed_manifest"]["valid"], d
          assert not any(d["seed_manifest"]["collisions"].values()), d
          assert d["substrate"]["valid"], d
          assert d["execution_lock"]["valid"], d
          assert d["historical_probe"]["seed"]==9595, d
          assert d["historical_probe"]["repeat"]["exact"], d
          assert d["historical_probe"]["geometry_inspected"] is False, d
          assert d["historical_probe"]["adjudicator_called"] is False, d
          assert d["fresh_seed_execution_attempted"] is False, d
          assert d["scientific_outcome_generated"] is False, d
          assert d["response_geometry_inspected"] is False, d
          assert d["predictor_fitting_performed"] is False, d
          assert d["difficulty_mutation_performed"] is False, d
          assert d["controller_execution_performed"] is False, d
          print("CLRM1_ZERO_SCIENCE_PREFLIGHT=PASS")
          PY
          sha256sum artifacts/clrm1_zero_science_preflight.json
          sha256sum docs/research/continual-loss-response/CLRM1_EXECUTION_LOCK.json
          sha256sum docs/research/continual-loss-response/clrm1-loss-response-support-protocol.md

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: clrm1-zero-science-preflight
          path: artifacts/clrm1_zero_science_preflight.json
          if-no-files-found: error
