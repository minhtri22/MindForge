name: ACO — ACO-1 zero-science preflight

on:
  workflow_dispatch:
  push:
    branches:
      - research/adaptive-continual-outcomes
    paths:
      - experiments/aco/**
      - tests/test_aco1_target_stability.py
      - docs/research/adaptive-continual-outcomes/aco1-target-stability-protocol.md
      - .github/workflows/aco1-zero-science-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Focused ACO-1 contract tests
        run: PYTHONPATH=. python -m pytest tests/test_aco1_target_stability.py -q
      - name: Run zero-science preflight
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python experiments/aco/aco1_target_stability.py --phase preflight --output artifacts/aco1_zero_science_preflight.json
      - name: Enforce no fresh execution
        run: |
          test ! -e docs/research/adaptive-continual-outcomes/ACO1_EXECUTION_LOCK.json
          test ! -e experiments/aco/results/aco1_fresh_records.json
          python - <<'PY'
          import json
          d=json.load(open("artifacts/aco1_zero_science_preflight.json", encoding="utf-8"))
          assert d["status"] == "PASS", d
          assert d["verdict"] == "ACO1_ZERO_SCIENCE_PREFLIGHT_PASS", d
          assert d["fresh_seed_execution_attempted"] is False, d
          assert d["scientific_outcome_generated"] is False, d
          assert d["seed_manifest"]["protected_collisions"] == [], d
          assert d["seed_manifest"]["historical_collisions"] == [], d
          assert d["checks"]["frozen_contract_valid"], d
          assert d["checks"]["historical_harness_integrity"], d
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
          sha256sum artifacts/aco1_zero_science_preflight.json
      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: aco1-zero-science-preflight
          path: artifacts/aco1_zero_science_preflight.json
          if-no-files-found: error
