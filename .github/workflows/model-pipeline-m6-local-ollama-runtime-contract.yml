name: Model Pipeline M6 Local Ollama Runtime Contract

on:
  push:
    branches:
      - research/model-pipeline-m6-ollama
    paths:
      - 'scripts/m6_local_ollama_runtime_oneclick.ps1'
      - 'tests/test_m6_local_ollama_runtime_contract.py'
      - 'artifacts/model-training-pipeline/m6/local_windows/ollama_runtime/**'
      - 'artifacts/model-training-pipeline/m6/local_windows/LOCAL_Q4_RECONSTRUCTION_EXECUTION_EVIDENCE.json'
      - '.github/workflows/model-pipeline-m6-local-ollama-runtime-contract.yml'
  workflow_dispatch:

jobs:
  static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - name: Local Ollama contract tests
        run: python -m pytest -q tests/test_m6_local_ollama_runtime_contract.py
      - name: PowerShell parse
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/m6_local_ollama_runtime_oneclick.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          Write-Host 'PowerShell syntax PASS'
      - name: Prove local runtime was not executed
        run: |
          test ! -d .local/M6-LOCAL-OLLAMA-RUNTIME
          echo "ollama_asset_downloaded=false"
          echo "ollama_create_executed=false"
          echo "ollama_chat_executed=false"
          echo "m6_scientific_execution_executed=false"
