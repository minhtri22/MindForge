name: Model Pipeline M6R2 S1 Zero-Science Contract

on:
  push:
    branches:
      - research/model-pipeline-m6r2-parity
    paths:
      - 'tools/m6r2_contract.py'
      - 'scripts/m6r2_parity_oneclick.ps1'
      - 'tests/test_m6r2_s1_contract.py'
      - 'artifacts/model-training-pipeline/m6r2/**'
      - 'docs/model-training-pipeline/M6R2_PARITY_REPLICATION.md'
      - '.github/workflows/model-pipeline-m6r2-s1-contract.yml'
  workflow_dispatch:

jobs:
  zero-science-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.2
      - name: M6R2 S1 contract tests
        run: python -m pytest -q tests/test_m6r2_s1_contract.py
      - name: Python compile
        run: python -m py_compile tools/m6r2_contract.py
      - name: PowerShell parse only
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/m6r2_parity_oneclick.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          Write-Host 'PowerShell syntax PASS'
      - name: Prove S1 did not execute runtime or science
        run: |
          test ! -d .local/M6R2-PARITY
          test ! -f artifacts/model-training-pipeline/m6r2/S2_INFRA_BINDING_AUTHORIZATION.json
          test ! -f artifacts/model-training-pipeline/m6r2/S3_EXECUTION_AUTHORIZATION.json
          echo "ollama_process_invoked=false"
          echo "ollama_api_requested=false"
          echo "local_model_created=false"
          echo "eval_v1_executed=false"
          echo "scientific_outcome_exposed=false"
          echo "s2_binding_executed=false"
          echo "s3_execution_executed=false"
