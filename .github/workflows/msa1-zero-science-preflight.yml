name: MSA — MSA-1 zero-science preflight

on:
  workflow_dispatch:
  push:
    branches:
      - research/measurement-substrate-adequacy
    paths:
      - docs/research/measurement-substrate-adequacy/MSA1_EXECUTION_LOCK.json

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - name: Install exact locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Focused synthetic contract tests
        run: PYTHONPATH=. python -m pytest tests/test_msa1_endpoint_adequacy.py -q
      - name: Run zero-science preflight
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python experiments/msa/msa1_endpoint_adequacy.py             --phase preflight             --output artifacts/msa1_zero_science_preflight.json
      - name: Enforce zero-science result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/msa1_zero_science_preflight.json",encoding="utf-8"))
          assert d["status"]=="PASS", d
          assert d["verdict"]=="MSA1_ZERO_SCIENCE_PREFLIGHT_PASS", d
          assert d["fresh_seed_execution_attempted"] is False, d
          assert d["scientific_outcome_generated"] is False, d
          assert d["difficulty_mutation_performed"] is False, d
          assert d["predictor_fitting_performed"] is False, d
          assert d["seed_manifest"]["valid"], d
          assert d["substrate"]["valid"], d
          assert d["checks"]["independent_verification_absent"], d
          assert d["checks"]["fresh_execution_blocked"], d
          print("MSA1_ZERO_SCIENCE_PREFLIGHT=PASS")
          PY
          sha256sum artifacts/msa1_zero_science_preflight.json
          sha256sum docs/research/measurement-substrate-adequacy/MSA1_EXECUTION_LOCK.json
          sha256sum docs/research/measurement-substrate-adequacy/msa1-endpoint-adequacy-protocol.md
      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: msa1-zero-science-preflight
          path: artifacts/msa1_zero_science_preflight.json
          if-no-files-found: error
