name: Kernel CL — KCL-6.5.9.5 mechanism-target validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/kernel-cl
    paths:
      - .github/workflows/kernel-cl-kcl6595-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify frozen train/rule/source contract
        run: |
          echo "ef72f9f78aa544fda5aae6220fca9ed7b40438e8e908270587b91298f3b78853  experiments/kernel_cl/results/kcl6595_train.json" | sha256sum -c -
          echo "2e6649a6f32040e56c0ecaac365ee28f593516dd24cff9f2bf3ddd7c87ce0c7b  experiments/kernel_cl/results/kcl6595_rule.json" | sha256sum -c -
          echo "c1d5a9b4ba26ea1574902ad024c636ed79965f8c98a5711b187b07cac31be326  docs/research/kernel-continual-learning/kcl6595-protocol.md" | sha256sum -c -
          echo "a3b22e2a0578ef9eb40e081209bd1f376ab5ab7325099121d512399e2f63eecb  experiments/kernel_cl/kcl6595_mechanism_target_identifiability.py" | sha256sum -c -
          python - <<'PY'
          import json
          d=json.load(open("experiments/kernel_cl/results/kcl6595_train.json"))
          r=json.load(open("experiments/kernel_cl/results/kcl6595_rule.json"))
          assert d["status"] == "PASS"
          assert d["verdict"] == "MECHANISM_TARGET_MODELS_TRAINED_AND_READY_TO_FREEZE"
          assert d["rule"]["sha256"] == "2e6649a6f32040e56c0ecaac365ee28f593516dd24cff9f2bf3ddd7c87ce0c7b"
          assert d["governance"]["validation_executed"] is False
          assert d["governance"]["protected_confirmatory_touched"] is False
          assert d["governance"]["controller_implemented"] is False
          assert d["governance"]["kcl7_started"] is False
          assert r["rule"] == "MSTI-v1"
          assert r["source_git_commit"] == "a7a1386602705687626c13fc7a0cab131c08d085"
          assert r["validation_executed_before_freeze"] is False
          assert r["protected_confirmatory_touched"] is False
          assert r["controller_implemented"] is False
          assert r["kcl7_started"] is False
          PY

      - name: Focused pre-validation contracts
        run: |
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl6595.py -q
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl6594.py -q

      - name: Assert validation evidence absent
        run: |
          test ! -e experiments/kernel_cl/results/kcl6595_validation.json

      - name: Frozen validation
        id: science
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python experiments/kernel_cl/kcl6595_mechanism_target_identifiability.py \
            --phase validate \
            --rule experiments/kernel_cl/results/kcl6595_rule.json \
            --output experiments/kernel_cl/results/kcl6595_validation.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

          test -f experiments/kernel_cl/results/kcl6595_validation.json
          sha256sum experiments/kernel_cl/results/kcl6595_validation.json
          python - <<'PY'
          import json
          d=json.load(open("experiments/kernel_cl/results/kcl6595_validation.json"))
          print("KCL6595_VALIDATION_STATUS="+str(d.get("status")))
          print("KCL6595_VALIDATION_VERDICT="+str(d.get("verdict")))
          print("KCL6595_VALIDATION_SUPPORT="+json.dumps(d.get("support",{}),sort_keys=True))
          print("KCL6595_VALIDATION_INTEGRITY="+json.dumps(d.get("integrity",{}),sort_keys=True))
          print("KCL6595_QUALIFIED_S2="+json.dumps(d.get("qualified_S2",{}),sort_keys=True))
          print("KCL6595_ROUTES="+json.dumps(d.get("routes",{}),sort_keys=True))
          print("KCL6595_DELTAS="+json.dumps(d.get("point_deltas_macro_recall",{}),sort_keys=True))
          print("KCL6595_BOOTSTRAP_DELTAS="+json.dumps(d.get("bootstrap",{}).get("deltas",{}),sort_keys=True))
          print("KCL6595_METRICS="+json.dumps(d.get("metrics",{}),sort_keys=True))
          print("KCL6595_SECONDARY="+json.dumps(d.get("secondary_diagnostics",{}),sort_keys=True))
          PY

      - name: Enforce scope guardrails
        run: |
          test ! -e experiments/kernel_cl/results/kcl6595_controller.json
          test ! -e .github/workflows/kernel-cl-kcl6595-controller.yml
          test ! -e .github/workflows/kernel-cl-kcl7.yml

      - name: Preserve exact validation evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/kernel_cl/results/kcl6595_validation.json
          git commit -m "evidence(kcl): preserve KCL-6.5.9.5 validation"
          git push origin HEAD:research/kernel-cl

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcl6595-mechanism-target-validation
          path: experiments/kernel_cl/results/kcl6595_validation.json
          if-no-files-found: error

      - name: Enforce valid scientific execution
        run: test "${{ steps.science.outputs.exit_code }}" -eq 0
