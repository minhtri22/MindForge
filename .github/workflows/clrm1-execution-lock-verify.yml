name: CLRM — CLRM-1 execution-lock verification

on:
  workflow_dispatch:
  push:
    branches:
      - research/continual-loss-response
    paths:
      - tools/clrm/verify_clrm1_execution_lock.py
      - tests/test_clrm1_execution_lock.py
      - .github/workflows/clrm1-execution-lock-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install exact locked runtime
        run: |
          python -m pip install pip==26.2.1
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Independent static verifier tests
        run: PYTHONPATH=. python -m pytest tests/test_clrm1_execution_lock.py -q

      - name: Run independent static verifier
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python tools/clrm/verify_clrm1_execution_lock.py

      - name: Enforce exact verification result
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/clrm1_execution_lock_verification.json",encoding="utf-8"))
          assert d["status"]=="PASS", d
          assert d["verdict"]=="CLRM1_EXECUTION_LOCK_VERIFICATION_PASS", d
          assert d["lock_sha256"]=="39d4e22081c6cb6ac551c6ac5a77816747dd5dc9c477bd11b09c12de8f880d2e", d
          assert not any(d["collisions"].values()), d
          assert d["checks"]["response_contract_exact"], d
          assert d["checks"]["geometry_gate_exact"], d
          assert d["checks"]["fresh_execution_workflow_absent"], d
          assert d["checks"]["fresh_collection_absent"], d
          assert d["checks"]["formal_result_absent"], d
          assert d["fresh_seed_execution_attempted"] is False, d
          assert d["scientific_outcome_generated"] is False, d
          assert d["response_geometry_inspected"] is False, d
          assert d["predictor_fitting_performed"] is False, d
          assert d["difficulty_mutation_performed"] is False, d
          assert d["controller_execution_performed"] is False, d
          print("CLRM1_EXECUTION_LOCK_VERIFICATION=PASS")
          PY
          sha256sum artifacts/clrm1_execution_lock_verification.json
          sha256sum docs/research/continual-loss-response/CLRM1_EXECUTION_LOCK.json

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: clrm1-execution-lock-verification
          path: artifacts/clrm1_execution_lock_verification.json
          if-no-files-found: error
