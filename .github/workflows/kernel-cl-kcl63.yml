name: Kernel CL — KCL-6.3 fuzzy reconstructive decay A-B-C-D

on:
  workflow_dispatch:
  push:
    branches:
      - research/kernel-cl
    paths:
      - experiments/kernel_cl/kcl63_fuzzy_decay_abcd.py
      - tests/test_kernel_cl_kcl63.py
      - .github/workflows/kernel-cl-kcl63.yml

permissions:
  contents: read

jobs:
  kcl63:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.3 pytest==8.4.2

      - name: Focused unit tests
        run: |
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl63.py -q
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl62.py -q
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl61.py -q
          PYTHONPATH=. python -m pytest tests/test_kernel_cl_kcl6.py -q

      - name: Frozen KCL-6.3 scientific run
        id: scientific
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python experiments/kernel_cl/kcl63_fuzzy_decay_abcd.py \
            --output experiments/kernel_cl/results/kcl63_summary.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: kcl63-evidence
          path: experiments/kernel_cl/results/kcl63_summary.json
          if-no-files-found: error

      - name: Enforce valid scientific closure
        run: test "${{ steps.scientific.outputs.exit_code }}" -eq 0
