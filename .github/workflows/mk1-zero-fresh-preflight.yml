name: MK1 Zero-Fresh Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - research/model_core
    paths:
      - "model_kernel/mk1/ZERO_FRESH_TRIGGER_v0.1.md"

jobs:
  zero-fresh-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Verify post-manifest one-shot authorization
        run: |
          grep -q 'IMPLEMENTATION_LOCK_MANIFEST_PASS' model_kernel/mk1/IMPLEMENTATION_LOCK_MANIFEST.md
          grep -q 'TRIGGER_CANONICAL_ZERO_FRESH_v0.1' model_kernel/mk1/ZERO_FRESH_TRIGGER_v0.1.md

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen CPU validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.5.2 pytest==9.1.1 tokenizers==0.21.4 psutil==7.2.2
          python -m pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Legacy MKS and MK1 contract tests
        run: |
          pytest -q tests/test_mks_model_kernel.py tests/test_model_core_mk1_preflight.py

      - name: Run zero-fresh preflight
        run: |
          python -m experiments.model_core.mk1.preflight --output mk1_zero_fresh_preflight_result.json

      - name: Upload zero-fresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: mk1-zero-fresh-preflight
          path: mk1_zero_fresh_preflight_result.json
          if-no-files-found: error
