name: ACO — ACO-1 execution-lock verification

on:
  workflow_dispatch:
  push:
    branches:
      - research/adaptive-continual-outcomes
    paths:
      - docs/research/adaptive-continual-outcomes/ACO1_EXECUTION_LOCK.json
      - tools/aco/verify_aco1_execution_lock.py
      - tests/test_aco1_execution_lock.py
      - .github/workflows/aco1-execution-lock-verify.yml

permissions:
  contents: read

jobs:
  verify-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install exact locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install numpy==2.3.3 pytest==8.4.2
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Lock-verifier tests
        run: PYTHONPATH=. python -m pytest tests/test_aco1_execution_lock.py -q

      - name: Independently verify execution lock
        run: |
          mkdir -p artifacts
          PYTHONPATH=. python tools/aco/verify_aco1_execution_lock.py \
            --lock docs/research/adaptive-continual-outcomes/ACO1_EXECUTION_LOCK.json \
            --output artifacts/aco1_execution_lock_verification.json

      - name: Enforce verification and zero science
        run: |
          test ! -e experiments/aco/results/aco1_fresh_records.json
          test ! -e experiments/aco/results/FORMAL_RESULT.json
          python - <<'PY'
          import json
          p="artifacts/aco1_execution_lock_verification.json"
          d=json.load(open(p, encoding="utf-8"))
          assert d["status"] == "PASS", d
          assert d["verdict"] == "ACO1_EXECUTION_LOCK_VERIFICATION_PASS", d
          assert d["fresh_seed_execution_attempted"] is False, d
          assert d["scientific_outcome_generated"] is False, d
          assert d["checks"]["execution_workflow_absent"], d
          assert d["checks"]["fresh_protected_disjoint"], d
          assert d["checks"]["no_post_preflight_scientific_source_change"], d
          print(json.dumps(d, indent=2, sort_keys=True))
          PY
          sha256sum docs/research/adaptive-continual-outcomes/ACO1_EXECUTION_LOCK.json
          sha256sum artifacts/aco1_execution_lock_verification.json

      - name: Upload lock-verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: aco1-execution-lock-verification
          path: artifacts/aco1_execution_lock_verification.json
          if-no-files-found: error
