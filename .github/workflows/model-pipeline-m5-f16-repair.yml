name: Model Pipeline M5 F16 Repair Requalification

on:
  workflow_dispatch:
  push:
    branches:
      - docs/evidence-model-training-pipeline
    paths:
      - 'pipeline/m2.py'
      - 'pipeline/m2_model.py'
      - 'pipeline/m2_worker.py'
      - 'tests/test_model_pipeline_m2_unit.py'
      - 'tools/m5_f16_requalification.py'
      - 'tests/test_model_pipeline_m5_f16_requalification.py'
      - 'artifacts/model-training-pipeline/m5_1/M5_1_RESULT_EVIDENCE.json'
      - 'docs/model-training-pipeline/runtime/llama_cpp.lock.json'
      - 'requirements-pipeline-m5.txt'
      - '.github/workflows/model-pipeline-m5.yml'
      - '.github/workflows/model-pipeline-m5-f16-repair.yml'

jobs:
  m5-f16-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install M5 pipeline dependencies
        run: python -m pip install -r requirements-pipeline-m5.txt

      - name: M0 to M5 foundation regressions
        run: |
          python -m pytest -q tests/test_model_pipeline_m0.py
          python -m pytest -q tests/test_model_pipeline_m1.py
          python -m pytest -q tests/test_model_pipeline_m2_unit.py
          python -m pytest -q tests/test_model_pipeline_m3.py
          python -m pytest -q tests/test_model_pipeline_m4.py
          python -m pytest -q tests/test_model_pipeline_m5.py
          python -m pytest -q tests/test_model_pipeline_m5_f16_requalification.py

      - name: Checkout exact pinned llama.cpp source
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          lock = json.loads(pathlib.Path("docs/model-training-pipeline/runtime/llama_cpp.lock.json").read_text())
          root = pathlib.Path(".m5-f16-tools")
          source = root / "llama.cpp"
          root.mkdir(exist_ok=True)
          subprocess.run(["git", "init", str(source)], check=True)
          subprocess.run(["git", "-C", str(source), "remote", "add", "origin", lock["source_url"]], check=True)
          subprocess.run(["git", "-C", str(source), "fetch", "--depth", "1", "origin", lock["commit_sha"]], check=True)
          subprocess.run(["git", "-C", str(source), "checkout", "--detach", "FETCH_HEAD"], check=True)
          actual = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
          if actual != lock["commit_sha"]:
              raise SystemExit(f"llama.cpp SHA mismatch: {actual}")
          print(actual)
          PY

      - name: Create exact isolated converter environment
        run: |
          python -m venv .m5-f16-tools/convert-venv
          .m5-f16-tools/convert-venv/bin/python -m pip install --upgrade pip
          .m5-f16-tools/convert-venv/bin/python -m pip install \
            -r .m5-f16-tools/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt

      - name: Verify converter imports
        run: |
          .m5-f16-tools/convert-venv/bin/python pipeline/m5_converter_probe.py | tee .m5-f16-tools/converter_probe.json
          python - <<'PY'
          import json
          import pathlib
          data = json.loads(pathlib.Path(".m5-f16-tools/converter_probe.json").read_text())
          failed = {k:v for k,v in data.items() if not isinstance(v, dict) or v.get("import_ok") is not True}
          if failed:
              raise SystemExit("converter preflight failed: " + json.dumps(failed, sort_keys=True))
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Build exact llama.cpp binaries and manifest
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          lock = json.loads(pathlib.Path("docs/model-training-pipeline/runtime/llama_cpp.lock.json").read_text())
          source = pathlib.Path(".m5-f16-tools/llama.cpp").resolve()
          build = source / "build"
          configure = ["cmake", "-S", str(source), "-B", str(build), *lock["build"]["flags"]]
          subprocess.run(configure, check=True)
          compile_cmd = [
              "cmake", "--build", str(build),
              "--target", *lock["build"]["targets"],
              "-j2",
          ]
          subprocess.run(compile_cmd, check=True)
          commit = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "schema": "mindforge-llama-cpp-build-v1",
              "source_commit": commit,
              "flags": lock["build"]["flags"],
              "targets": lock["build"]["targets"],
              "configure_command": configure,
              "build_command": compile_cmd,
          }
          pathlib.Path(".m5-f16-tools/build_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Requalify repaired M2 canonical artifact through real F16 llama.cpp
        run: |
          set -o pipefail
          python -m tools.m5_f16_requalification \
            -c docs/model-training-pipeline/examples/end_to_end_small.yaml \
            --workspace . \
            --runs-root .m5-f16-runs \
            --llama-source .m5-f16-tools/llama.cpp \
            --llama-cli .m5-f16-tools/llama.cpp/build/bin/llama-cli \
            --llama-quantize .m5-f16-tools/llama.cpp/build/bin/llama-quantize \
            --converter-python .m5-f16-tools/convert-venv/bin/python \
            --build-manifest .m5-f16-tools/build_manifest.json \
            --json | tee .m5-f16-result.json

      - name: Enforce F16-only governance boundary
        run: |
          python - <<'PY'
          import json
          import pathlib
          data = json.loads(pathlib.Path(".m5-f16-result.json").read_text())
          assert data["status"] == "PASS"
          assert data["quantization_executed"] is False
          assert data["quantization_authorized"] is True
          assert data["m6_authorized"] is False
          assert data["bulk_training_authorized"] is False
          assert data["gates"]["m2_canonical_tokenizer_source_fidelity"]["pass"] is True
          assert data["gates"]["f16_conversion"]["pass"] is True
          assert data["gates"]["f16_real_inference"]["pass"] is True
          assert data["gates"]["f16_hf_llama_task_format_parity"]["pass"] is True
          print(data["result_hash"])
          PY

      - name: Upload F16-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-f16-repair-requalification
          path: |
            .m5-f16-result.json
            .m5-f16-tools/converter_probe.json
            .m5-f16-runs/**/m5_f16_requalification/*.json
            .m5-f16-runs/**/m5_f16_requalification/*.txt
          if-no-files-found: warn
