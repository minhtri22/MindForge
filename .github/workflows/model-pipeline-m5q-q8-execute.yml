name: Model Pipeline M5Q Q8 One-Shot Qualification

on:
  push:
    branches:
      - research/model-pipeline-m5-quantization-qualification
    paths:
      - '.github/workflows/model-pipeline-m5q-q8-execute.yml'
      - 'artifacts/model-training-pipeline/m5_quantization/Q8_0_EXECUTION_AUTHORIZATION.json'

jobs:
  q8-one-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify one-shot authorization and frozen readiness evidence
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          auth_path = pathlib.Path("artifacts/model-training-pipeline/m5_quantization/Q8_0_EXECUTION_AUTHORIZATION.json")
          auth = json.loads(auth_path.read_text())
          evidence = json.loads(pathlib.Path(
              "artifacts/model-training-pipeline/m5_quantization/Q8_0_ZERO_SCIENCE_PREFLIGHT_EVIDENCE.json"
          ).read_text())

          assert auth["schema"] == "mindforge-model-pipeline-m5q-q8-execution-authorization-v1"
          assert auth["status"] == "AUTHORIZED_ONE_SHOT"
          assert auth["scientific_implementation_commit"] == "68bbd071ba78f6325748159703a90232d69e4ade"
          assert auth["preflight_closure_commit"] == "6935e0047e987c4a2d8528f1faf5ca2c16ed9390"
          assert auth["target"] == "q8_0"
          assert auth["quantizer_type"] == "Q8_0"
          assert auth["q4_execution_authorized"] is False
          assert auth["m6_authorized"] is False

          assert evidence["verdict"] == "PASS"
          assert evidence["scientific_implementation_commit"] == auth["scientific_implementation_commit"]
          assert evidence["state_after_preflight"]["q8_0"] == "READY_FOR_ONE_SHOT_EXECUTION"
          assert evidence["execution_boundary"]["q4_execution_authorized"] is False
          assert evidence["execution_boundary"]["m6_authorized"] is False

          workflow = ".github/workflows/model-pipeline-m5q-q8-execute.yml"
          actual = subprocess.check_output(["git", "hash-object", "--", workflow], text=True).strip()
          assert actual == auth["execution_workflow_git_blob_sha1"], (actual, auth["execution_workflow_git_blob_sha1"])
          print("Q8_ONE_SHOT_AUTHORIZATION_VERIFIED")
          PY

      - name: Install exact locked M5 dependencies
        run: python -m pip install -r requirements-pipeline-m5.txt

      - name: Reverify exact implementation lock before scientific execution
        run: |
          set -o pipefail
          python -m tools.m5q_q8_preflight --workspace . --json | tee q8-pre-execution-lock-check.json
          python - <<'PY'
          import json
          import pathlib
          data = json.loads(pathlib.Path("q8-pre-execution-lock-check.json").read_text())
          assert data["status"] == "PASS"
          assert data["implementation_commit"] == "68bbd071ba78f6325748159703a90232d69e4ade"
          assert data["quantization_executed"] is False
          assert data["q4_executed"] is False
          assert data["m6_authorized"] is False
          PY

      - name: Checkout exact pinned llama.cpp source
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          lock = json.loads(pathlib.Path("docs/model-training-pipeline/runtime/llama_cpp.lock.json").read_text())
          root = pathlib.Path(".m5q-q8-tools")
          source = root / "llama.cpp"
          root.mkdir(exist_ok=True)
          subprocess.run(["git", "init", str(source)], check=True)
          subprocess.run(["git", "-C", str(source), "remote", "add", "origin", lock["source_url"]], check=True)
          subprocess.run(["git", "-C", str(source), "fetch", "--depth", "1", "origin", lock["commit_sha"]], check=True)
          subprocess.run(["git", "-C", str(source), "checkout", "--detach", "FETCH_HEAD"], check=True)
          actual = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
          if actual != lock["commit_sha"]:
              raise SystemExit(f"llama.cpp SHA mismatch: {actual}")
          print(actual)
          PY

      - name: Create exact isolated converter environment
        run: |
          python -m venv .m5q-q8-tools/convert-venv
          .m5q-q8-tools/convert-venv/bin/python -m pip install --upgrade pip
          .m5q-q8-tools/convert-venv/bin/python -m pip install \
            -r .m5q-q8-tools/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt

      - name: Verify converter imports
        run: |
          set -o pipefail
          .m5q-q8-tools/convert-venv/bin/python pipeline/m5_converter_probe.py | tee .m5q-q8-tools/converter_probe.json
          python - <<'PY'
          import json
          import pathlib
          data = json.loads(pathlib.Path(".m5q-q8-tools/converter_probe.json").read_text())
          failed = {k:v for k,v in data.items() if not isinstance(v, dict) or v.get("import_ok") is not True}
          if failed:
              raise SystemExit("converter preflight failed: " + json.dumps(failed, sort_keys=True))
          PY

      - name: Build exact llama.cpp binaries and manifest
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          lock = json.loads(pathlib.Path("docs/model-training-pipeline/runtime/llama_cpp.lock.json").read_text())
          source = pathlib.Path(".m5q-q8-tools/llama.cpp").resolve()
          build = source / "build"
          configure = ["cmake", "-S", str(source), "-B", str(build), *lock["build"]["flags"]]
          subprocess.run(configure, check=True)
          compile_cmd = [
              "cmake", "--build", str(build),
              "--target", *lock["build"]["targets"],
              "-j2",
          ]
          subprocess.run(compile_cmd, check=True)
          commit = subprocess.check_output(["git", "-C", str(source), "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "schema": "mindforge-llama-cpp-build-v1",
              "source_commit": commit,
              "flags": lock["build"]["flags"],
              "targets": lock["build"]["targets"],
              "configure_command": configure,
              "build_command": compile_cmd,
          }
          pathlib.Path(".m5q-q8-tools/build_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Execute exactly one Q8_0 scientific qualification
        id: execute_q8
        continue-on-error: true
        run: |
          set -o pipefail
          python -m tools.m5q_q8_qualification \
            -c docs/model-training-pipeline/examples/end_to_end_small.yaml \
            --workspace . \
            --runs-root .m5q-q8-runs \
            --llama-source .m5q-q8-tools/llama.cpp \
            --llama-cli .m5q-q8-tools/llama.cpp/build/bin/llama-cli \
            --llama-quantize .m5q-q8-tools/llama.cpp/build/bin/llama-quantize \
            --converter-python .m5q-q8-tools/convert-venv/bin/python \
            --build-manifest .m5q-q8-tools/build_manifest.json \
            --json | tee .m5q-q8-console-result.json

      - name: Freeze and adjudicate Q8_0 one-shot result
        if: always()
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil
          import sys

          results = list(pathlib.Path(".m5q-q8-runs").glob("**/M5Q_Q8_QUALIFICATION_RESULT.json"))
          if len(results) != 1:
              print(json.dumps({
                  "classification": "INVALID_INFRASTRUCTURE",
                  "reason": f"expected exactly one Q8 scientific result, found {len(results)}",
                  "q4_executed": False,
                  "m6_authorized": False,
              }, indent=2))
              sys.exit(3)

          data = json.loads(results[0].read_text())
          assert data["schema"] == "mindforge-model-pipeline-m5q-q8-qualification-v1"
          assert data["target"] == "q8_0"
          assert data["quantizer_type"] == "Q8_0"
          assert data["q4_executed"] is False
          assert data["m6_authorized"] is False
          assert data["m6_auto_open"] is False
          assert data["bulk_training_authorized"] is False
          assert data["parent"]["m5_f16_closure_commit"] == "9ff987ebd95cd23fef4cd2a0511774d772b14400"
          assert data["parent"]["f16_result_hash"] == "0f76c8b2a420a629927f758fc6bc21b4c92c08b052ee7b76e49eef9161dd3e57"

          pathlib.Path(".m5q-q8-result.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "classification": "SCIENTIFIC_RESULT",
              "status": data["status"],
              "result_hash": data["result_hash"],
              "failed_required_gates": data["failed_required_gates"],
              "q4_executed": data["q4_executed"],
              "m6_authorized": data["m6_authorized"],
          }, indent=2))

          if data["status"] != "PASS":
              sys.exit(2)
          PY

      - name: Upload frozen Q8_0 one-shot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5q-q8-one-shot-evidence
          path: |
            .m5q-q8-result.json
            .m5q-q8-console-result.json
            q8-pre-execution-lock-check.json
            .m5q-q8-tools/converter_probe.json
            .m5q-q8-tools/build_manifest.json
            .m5q-q8-runs/**/m5q_q8_0/*.json
            .m5q-q8-runs/**/m5q_q8_0/*.log
          if-no-files-found: warn
