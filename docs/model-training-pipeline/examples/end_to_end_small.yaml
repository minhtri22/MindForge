experiment:
  id: e2e-small
  mode: smoke
  seed_sets:
    development: [11]
    calibration: []
    fresh_confirmatory: []

model:
  source: huggingface
  id: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  require_resolved_sha: true
  allow_remote_code: false

datasets:
  wiki_mini:
    adapter: fixture_text
    snapshot: fixtures-v1
    path: tests/fixtures/data/wiki_mini.jsonl
    freshness_class: development
  code_mini:
    adapter: fixture_code
    snapshot: fixtures-v1
    path: tests/fixtures/data/code_mini.jsonl
    freshness_class: development
  reasoning_mini:
    adapter: fixture_reasoning
    snapshot: fixtures-v1
    path: tests/fixtures/data/reasoning_mini.jsonl
    freshness_class: development

phases:
  - id: domain_cpt
    type: cpt
    datasets: [wiki_mini, code_mini]
    stop:
      kind: max_steps
      value: 20
    optimizer_transition: reset
    scheduler_transition: reset
    training:
      precision: fp32
      sequence_length: 512
      learning_rate: 0.00001
      warmup:
        unit: steps
        value: 1
      checkpoint_every_steps: 10
      save_optimizer_state: true

  - id: reasoning_sft
    type: reasoning_sft
    datasets: [reasoning_mini]
    stop:
      kind: max_steps
      value: 20
    optimizer_transition: reset
    scheduler_transition: reset
    training:
      precision: fp32
      sequence_length: 512
      learning_rate: 0.00001
      warmup:
        unit: steps
        value: 1
      checkpoint_every_steps: 10
      save_optimizer_state: true

baselines:
  - id: smoke_reference
    role: smoke_reference
    model_id: Qwen/Qwen2.5-0.5B-Instruct
    revision: 7ae557604adf67be50417f59c2c2f167def9a775
  - id: parent
    role: parent_baseline
    model_id: Qwen/Qwen2.5-0.5B-Instruct
    revision: 7ae557604adf67be50417f59c2c2f167def9a775

evaluation:
  fixture_set: tests/fixtures/eval_v1
  checkpoint_selection:
    phase_id: reasoning_sft
    rule: metric_best
    metric_id: validation_loss
    direction: min
    tie_breaker: earliest_step
  inference:
    max_new_tokens: 128
    temperature: 0.0
    top_p: 1.0
    top_k: 0
    seed: 42
    context_length: 2048
    stream: false

reasoning:
  mode: visible
  transport_preference: tagged_text
  fallback_transport: none
  tags:
    start: "<think>"
    end: "</think>"

export:
  hf: true
  gguf:
    high_fidelity: f16
    quantize: [q4_k_m]
  verify_llama_cpp: true
  verify_ollama: true
