experiment:
  id: wikipedia-cpt-dev
  mode: development
  seed_sets:
    development: [42]
    calibration: []
    fresh_confirmatory: []

model:
  source: huggingface
  id: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  require_resolved_sha: true
  allow_remote_code: false
  profile: profiles/qwen2.5-0.5b-instruct-r0.yaml

datasets:
  wikipedia_en_20260301:
    adapter: wikimedia_dump
    snapshot: enwiki-20260301-pages-articles-multistream
    project: enwiki
    language: en
    dump_date: "20260301"
    artifact_type: pages-articles-multistream.xml.bz2
    uri: https://dumps.wikimedia.org/enwiki/20260301/enwiki-20260301-pages-articles-multistream.xml.bz2
    checksum_source_uri: https://dumps.wikimedia.org/enwiki/20260301/enwiki-20260301-sha1sums.txt
    freshness_class: development

phases:
  - id: wikipedia_cpt
    type: cpt
    parent_ref: model
    datasets: [wikipedia_en_20260301]
    token_stream:
      add_bos: false
      add_eos: true
      separator_policy: eos
      sequence_length: 2048
      truncation: right
      packing: {enabled: true, cross_document: true, remainder_policy: carry}
      sampling: {mode: without_replacement, shuffle_algorithm: buffered_v1, shuffle_buffer_size: 10000, seed: 42}
      workers: 4
    stop: {kind: max_tokens, value: 100000000}
    optimizer_transition: reset
    scheduler_transition: reset
    checkpoint_selection: {rule: metric_best, metric_id: validation_loss, direction: min, tie_breaker: earliest_step}
    training:
      precision: auto
      learning_rate: 0.000005
      warmup: {unit: ratio, value: 0.03}
      checkpoint_every_steps: 500
      save_optimizer_state: true

baselines:
  - id: parent
    role: parent_baseline
    source: model_revision
    model_id: Qwen/Qwen2.5-0.5B-Instruct
    revision: 7ae557604adf67be50417f59c2c2f167def9a775

evaluation:
  fixture_set: eval/wikipedia_dev_v1
  metrics:
    - metric_id: heldout_loss_delta
      metric_version: "1"
      target_artifact: phase:wikipedia_cpt
      baseline_id: parent
      comparison_type: absolute_delta
      operator: "<="
      threshold: 0.0
      aggregation: {unit: token, method: mean}
      required: true
      missing_data_policy: fail
  inference:
    max_new_tokens: 128
    temperature: 0.0
    top_p: 1.0
    top_k: 0
    seed: 42
    context_length: 2048
    stream: false

reasoning:
  mode: off
  transport_preference: tagged_text
  fallback_transport: none
  tags: {start: "<think>", end: "</think>"}

export:
  hf: true
  gguf:
    high_fidelity: f16
    quantize: [q4_k_m]
  verify_llama_cpp: false
  verify_ollama: false
