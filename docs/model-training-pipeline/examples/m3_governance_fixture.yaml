experiment:
  id: m3-governance-fixture
  mode: development
  seed_sets:
    development: [11]
    calibration: []
    fresh_confirmatory: []

model:
  source: huggingface
  id: Qwen/Qwen2.5-0.5B-Instruct
  revision: 7ae557604adf67be50417f59c2c2f167def9a775
  require_resolved_sha: true
  allow_remote_code: false
  profile: profiles/qwen2.5-0.5b-instruct-r0.yaml

datasets:
  wiki_mini:
    adapter: fixture_text
    snapshot: fixtures-v1
    path: tests/fixtures/data/wiki_mini.jsonl
    freshness_class: development
  code_mini:
    adapter: fixture_code
    snapshot: fixtures-v1
    path: tests/fixtures/data/code_mini.jsonl
    freshness_class: development
  reasoning_mini:
    adapter: fixture_reasoning
    snapshot: fixtures-v1
    path: tests/fixtures/data/reasoning_mini.jsonl
    freshness_class: development

phases:
  - id: domain_cpt
    type: cpt
    parent_ref: model
    datasets: [wiki_mini, code_mini]
    token_stream:
      add_bos: false
      add_eos: true
      separator_policy: eos
      sequence_length: 512
      truncation: right
      packing: {enabled: true, cross_document: true, remainder_policy: carry}
      sampling: {mode: without_replacement, shuffle_algorithm: buffered_v1, shuffle_buffer_size: 64, seed: 11}
      workers: 0
    stop: {kind: max_steps, value: 20}
    optimizer_transition: reset
    scheduler_transition: reset
    checkpoint_selection: {rule: metric_best, metric_id: validation_loss, direction: min, tie_breaker: earliest_step}
    training:
      precision: fp32
      learning_rate: 0.00001
      warmup: {unit: steps, value: 1}
      checkpoint_every_steps: 10
      save_optimizer_state: true

  - id: reasoning_sft
    type: reasoning_sft
    parent_ref: phase:domain_cpt
    datasets: [reasoning_mini]
    token_stream:
      add_bos: false
      add_eos: true
      separator_policy: eos
      sequence_length: 512
      truncation: right
      packing: {enabled: false, cross_document: false, remainder_policy: pad}
      sampling: {mode: without_replacement, shuffle_algorithm: buffered_v1, shuffle_buffer_size: 64, seed: 11}
      workers: 0
    stop: {kind: max_steps, value: 20}
    optimizer_transition: reset
    scheduler_transition: reset
    checkpoint_selection: {rule: metric_best, metric_id: validation_loss, direction: min, tie_breaker: earliest_step}
    training:
      precision: fp32
      learning_rate: 0.00001
      warmup: {unit: steps, value: 1}
      checkpoint_every_steps: 10
      save_optimizer_state: true

baselines:
  - id: root_parent
    role: parent_baseline
    source: model_revision
    model_id: Qwen/Qwen2.5-0.5B-Instruct
    revision: 7ae557604adf67be50417f59c2c2f167def9a775
  - id: matched_control_fixture
    role: matched_control
    source: control_run
    control_run_id: m3-control-fixture-v1
    parent_baseline: root_parent
    intervention: none
    matched_to: root_parent
    seeds: [11]
    token_budget: 40
    resource_class: fixture-cpu

evaluation:
  fixture_set: tests/fixtures/m3_eval_v1
  metrics:
    - metric_id: domain_retention
      metric_version: "1"
      target_artifact: phase:domain_cpt
      baseline_id: root_parent
      comparison_type: absolute_delta
      operator: ">="
      threshold: -0.02
      aggregation: {unit: fixture, method: mean}
      required: true
      missing_data_policy: fail
    - metric_id: answer_accuracy
      metric_version: "1"
      target_artifact: phase:reasoning_sft
      baseline_id: matched_control_fixture
      comparison_type: absolute_delta
      operator: ">="
      threshold: 0.05
      aggregation: {unit: fixture, method: mean}
      required: true
      missing_data_policy: fail
    - metric_id: protected_accuracy
      metric_version: "1"
      target_artifact: phase:reasoning_sft
      baseline_id: root_parent
      comparison_type: absolute_delta
      operator: ">="
      threshold: -0.02
      aggregation: {unit: fixture, method: mean}
      required: true
      missing_data_policy: fail
  inference:
    max_new_tokens: 64
    temperature: 0.0
    top_p: 1.0
    top_k: 0
    seed: 11
    context_length: 512
    stream: false

reasoning:
  mode: visible
  transport_preference: tagged_text
  fallback_transport: none
  tags: {start: "<think>", end: "</think>"}

export:
  hf: true
  gguf:
    high_fidelity: f16
    quantize: [q4_k_m]
  verify_llama_cpp: true
  verify_ollama: true
