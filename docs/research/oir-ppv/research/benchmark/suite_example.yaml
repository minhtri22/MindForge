    env_config: "environments/env2_config.yaml"
    baseline: "B5"
    baseline_config: "experiments/baselines/b5_config.yaml"
    seed: 42

  # ENV-3 with all baselines + intervention
  - experiment_id: "EXP-M2-ENV3-B0"
    env_config: "environments/env3_config.yaml"
    baseline: "B0"
    baseline_config: "experiments/baselines/b0_config.yaml"
    seed: 42
    intervention_targets: ["do(A)", "do(Z)", "do(N)"]
  
  - experiment_id: "EXP-M2-ENV3-B3"
    env_config: "environments/env3_config.yaml"
    baseline: "B3"
    baseline_config: "experiments/baselines/b3_config.yaml"
    seed: 42
    intervention_targets: ["do(A)", "do(Z)", "do(N)"]
  
  - experiment_id: "EXP-M2-ENV3-B4"
    env_config: "environments/env3_config.yaml"
    baseline: "B4"
    baseline_config: "experiments/baselines/b4_config.yaml"
    seed: 42
    intervention_targets: ["do(A)", "do(Z)", "do(N)"]
    counterfactual: true
  
  - experiment_id: "EXP-M2-ENV3-B5"
    env_config: "environments/env3_config.yaml"
    baseline: "B5"
    baseline_config: "experiments/baselines/b5_config.yaml"
