protocol:
  name: "M3_PROTOCOL"
  version: "M3-Protocol-v1.0"
  path: "benchmark/M3_PROTOCOL.md"

# Stress Scenario 4: OOD Generalization
# ENV-1 with unseen style/context combinations

experiment:
  id: "EXP-M4-STRESS-OOD"
  name: "Stress Test: OOD Generalization"
  milestone: "M4"
  description: "Test generalization to unseen style/context combinations"

environment:
  family: "ENV-1"
  config_path: "environments/env1_config.yaml"
  seed: 42
  splits: ["train", "val", "test"]
  overrides:
    generation:
      num_samples: 3000
    # Hold out style_c and id_5 combinations
    ood_splits:
      - name: "unseen_style_context"
        holdout: [["style_c", "id_5"]]

stress_assertion:
  type: "ood_holdout"
  ood_split: "ood_unseen_style_context"

pipeline:
  invariant_extractor:
    type: "Autoencoder"
    output_dim: 64
    hidden_dim: 128
    learning_rate: 0.01
    epochs: 50
    seed: 42
  
  generator:
    type: "MLPDecoder"
    output_dim: 12  # ENV-1 observation dim
    hidden_dims: [128, 64]
    learning_rate: 0.01
    epochs: 50
    seed: 42

evaluation:
  enabled: true
  metrics:
    - "invariant_consistency"
    - "generation_validity"
    - "reconstruction_quality"
    - "invariant_preservation"
    - "context_response"
    - "diversity"
    - "distribution_similarity"
  intervention_targets: ["do(A)", "do(Z)", "do(N)"]
  counterfactual: true
  causal_validation: true
  dependency_analysis: true

output:
  base_dir: "artifacts/stress_test"
  save_intermediate: true
  save_generated: true
  save_evaluation: true

provenance:
  track_config_hashes: true
  track_seeds: true
  track_timing: true
