protocol:
  name: "M3_PROTOCOL"
  version: "M3-Protocol-v1.0"
  path: "benchmark/M3_PROTOCOL.md"

# Stress Scenario 3: Hidden Shortcut Challenge
# ENV-4 with reversed shortcut in test

experiment:
  id: "EXP-M4-STRESS-SHORTCUT"
  name: "Stress Test: Hidden Shortcut Challenge"
  milestone: "M4"
  description: "Test shortcut resistance when shortcut is reversed at test time"

environment:
  family: "ENV-4"
  config_path: "environments/env4_config.yaml"
  seed: 42
  splits: ["train", "val", "test"]
  overrides:
    generation:
      num_samples: 3000
    shortcut:
      correlation_strength: 0.9
      # Reversed shortcut in test
      test_conditional_means:
        0: 2.0
        1: 0.0
        2: -2.0

stress_assertion:
  type: "shortcut_reversal"
  feature: "spurious_feature"
  min_train_correlation: 0.3
  max_test_correlation: -0.3

pipeline:
  invariant_extractor:
    type: "Autoencoder"
    output_dim: 64
    hidden_dim: 128
    learning_rate: 0.01
    epochs: 50
    seed: 42
  
  generator:
    type: "MLPDecoder"
    output_dim: 11
    hidden_dims: [128, 64]
    learning_rate: 0.01
    epochs: 50
    seed: 42

evaluation:
  enabled: true
  metrics:
    - "invariant_consistency"
    - "generation_validity"
    - "reconstruction_quality"
    - "invariant_preservation"
    - "context_response"
    - "diversity"
    - "distribution_similarity"
  intervention_targets: ["do(A)", "do(Z)", "do(N)"]
  counterfactual: true
  causal_validation: true
  dependency_analysis: true

output:
  base_dir: "artifacts/stress_test"
  save_intermediate: true
  save_generated: true
  save_evaluation: true

provenance:
  track_config_hashes: true
  track_seeds: true
  track_timing: true
