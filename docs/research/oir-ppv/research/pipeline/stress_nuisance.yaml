protocol:
  name: "M3_PROTOCOL"
  version: "M3-Protocol-v1.0"
  path: "benchmark/M3_PROTOCOL.md"

# Stress Scenario 1: Strong Nuisance Shift
# ENV-4 with increased nuisance correlation

experiment:
  id: "EXP-M4-STRESS-NUISANCE"
  name: "Stress Test: Strong Nuisance Shift"
  milestone: "M4"
  description: "Test invariance under strong nuisance distribution shift"

environment:
  family: "ENV-4"
  config_path: "environments/env4_config.yaml"
  seed: 42
  splits: ["train", "val", "test"]
  # Override to increase nuisance shift
  overrides:
    generation:
      num_samples: 3000
    shortcut:
      correlation_strength: 0.95  # Stronger shortcut
      test_conditional_means:
        0: 3.0
        1: 3.0
        2: 3.0

stress_assertion:
  type: "nuisance_distribution"
  feature: "spurious_feature"
  min_mean_shift: 1.0

pipeline:
  invariant_extractor:
    type: "Autoencoder"
    output_dim: 64
    hidden_dim: 128
    learning_rate: 0.01
    epochs: 50
    seed: 42
  
  generator:
    type: "MLPDecoder"
    output_dim: 11
    hidden_dims: [128, 64]
    learning_rate: 0.01
    epochs: 50
    seed: 42

evaluation:
  enabled: true
  metrics:
    - "invariant_consistency"
    - "generation_validity"
    - "reconstruction_quality"
    - "invariant_preservation"
    - "context_response"
    - "diversity"
    - "distribution_similarity"
  intervention_targets: ["do(A)", "do(Z)", "do(N)"]
  counterfactual: true
  causal_validation: true
  dependency_analysis: true

output:
  base_dir: "artifacts/stress_test"
  save_intermediate: true
  save_generated: true
  save_evaluation: true

provenance:
  track_config_hashes: true
  track_seeds: true
  track_timing: true
