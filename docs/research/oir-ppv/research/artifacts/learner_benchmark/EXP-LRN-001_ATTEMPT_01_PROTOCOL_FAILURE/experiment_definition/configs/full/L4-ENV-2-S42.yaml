protocol:
  name: M3_PROTOCOL
  version: M3-Protocol-v1.0
  path: benchmark/M3_PROTOCOL.md
experiment:
  id: L4-ENV-2-S42
  name: EXP-LRN-001 reference learner cell
  milestone: M4.1
environment:
  family: ENV-2
  config_path: environments/env2_config.yaml
  seed: 42
  splits:
  - train
  - val
  - test
  - ood
  overrides:
    generation:
      num_samples: 1600
stress_assertion:
  type: composition_holdout
pipeline:
  invariant_extractor:
    type: DANN
    output_dim: 8
    hidden_dim: 24
    learning_rate: 0.01
    epochs: 4
    domain_penalty_weight: 0.5
    seed: 42
  generator:
    type: MLPDecoder
    output_dim: 15
    hidden_dims:
    - 24
    learning_rate: 0.01
    epochs: 4
    seed: 42
evaluation:
  enabled: true
  metrics:
  - invariant_consistency
  - generation_validity
  - reconstruction_quality
  - invariant_preservation
  - context_response
  - diversity
  - distribution_similarity
  intervention_targets:
  - do(N)
  - do(Z)
  counterfactual: true
  causal_validation: true
  dependency_analysis: true
output:
  base_dir: artifacts/learner_benchmark/EXP-LRN-001
provenance:
  track_config_hashes: true
  track_seeds: true
  track_timing: true
