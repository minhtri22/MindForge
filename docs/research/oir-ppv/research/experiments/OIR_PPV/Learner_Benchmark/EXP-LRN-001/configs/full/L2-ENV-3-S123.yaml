protocol:
  name: M3_PROTOCOL
  version: M3-Protocol-v1.0
  path: benchmark/M3_PROTOCOL.md
experiment:
  id: L2-ENV-3-S123
  name: EXP-LRN-001 reference learner cell
  milestone: M4.1
environment:
  family: ENV-3
  config_path: environments/env3_config.yaml
  seed: 123
  splits:
  - train
  - val
  - test
  - ood
  overrides:
    generation:
      num_episodes: 150
stress_assertion:
  type: context_distribution
  ood_split: ood_unseen_context
  min_total_variation: 0.5
pipeline:
  invariant_extractor:
    type: VAE
    output_dim: 8
    hidden_dim: 24
    learning_rate: 0.005
    epochs: 4
    beta: 0.1
    seed: 123
  generator:
    type: MLPDecoder
    output_dim: 6
    hidden_dims:
    - 24
    learning_rate: 0.01
    epochs: 4
    seed: 123
evaluation:
  enabled: true
  metrics:
  - invariant_consistency
  - generation_validity
  - reconstruction_quality
  - invariant_preservation
  - context_response
  - diversity
  - distribution_similarity
  intervention_targets:
  - do(N)
  - do(Z)
  counterfactual: true
  causal_validation: true
  dependency_analysis: true
output:
  base_dir: artifacts/learner_benchmark/EXP-LRN-001
provenance:
  track_config_hashes: true
  track_seeds: true
  track_timing: true
