# B0: ERM / Context Memorization Baseline Configuration
# Empirical Risk Minimization - memorizes context-specific patterns

baseline:
  id: "B0"
  name: "ERM / Context Memorization"
  type: "erm"
  version: "1.0"

model:
  architecture: "mlp"
  hidden_dims: [256, 128, 64]
  activation: "relu"
  dropout: 0.1

training:
  optimizer: "adam"
  learning_rate: 0.001
  batch_size: 64
  epochs: 100
  early_stopping_patience: 10
  loss: "cross_entropy"

# No invariant constraint - standard ERM
invariant_constraint:
  enabled: false

# Context handling: concatenate context to input
context_handling: "concat"

# Evaluation
evaluation:
  metrics: ["accuracy", "auroc", "f1"]
  ood_splits: true