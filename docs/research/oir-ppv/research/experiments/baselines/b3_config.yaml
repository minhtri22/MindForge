# B3: Invariant Representation Only Baseline Configuration
# Learn invariant representation I, but no generator G(I,Z,N)

baseline:
  id: "B3"
  name: "Invariant Representation Only"
  type: "invariant_only"
  version: "1.0"

invariant_learner:
  architecture: "mlp"
  hidden_dims: [256, 128]
  invariant_dim: 64
  activation: "relu"
  dropout: 0.1

predictor:
  architecture: "mlp"
  hidden_dims: [64, 32]
  activation: "relu"

training:
  optimizer: "adam"
  learning_rate: 0.001
  batch_size: 64
  epochs: 100
  early_stopping_patience: 10
  base_loss: "cross_entropy"

# Invariant constraint: I ⟂ N (independence from nuisance)
invariant_constraint:
  enabled: true
  method: "hsic"  # Options: "hsic", "mmd", "correlation", "adversarial"
  weight: 1.0
  
  # HSIC specific
  hsic:
    kernel: "rbf"
    sigma: 1.0
  
  # MMD specific
  mmd:
    kernel: "rbf"
    sigma: 1.0
  
  # Adversarial specific
  adversarial:
    discriminator_hidden: [64, 32]
    discriminator_lr: 0.001
    gradient_reversal_lambda: 1.0

# No generator - only invariant representation + predictor
generator:
  enabled: false

context_handling: "invariant_conditioning"

evaluation:
  metrics: ["accuracy", "auroc", "f1", "invariant_quality", "nuisance_independence"]
  ood_splits: true