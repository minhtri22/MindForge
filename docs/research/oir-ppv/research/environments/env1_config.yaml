# ENV-1: Identity and Style Shift Configuration
# Keep underlying mechanism fixed, vary style/identity/presentation

environment:
  family: "ENV-1"
  name: "Identity and Style Shift"
  version: "1.0"

# Data generation parameters
generation:
  mechanism: "fixed"  # The causal mechanism stays constant
  num_samples: 10000
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Style/Identity variables (Z - context)
context_variables:
  - name: "style"
    type: "categorical"
    values: ["style_a", "style_b", "style_c"]
    distribution: "uniform"
  - name: "identity"
    type: "categorical"
    values: ["id_1", "id_2", "id_3", "id_4", "id_5"]
    distribution: "uniform"

# Nuisance variables (N)
nuisance_variables:
  - name: "background_noise"
    type: "continuous"
    distribution: "normal"
    params: {mean: 0.0, std: 0.1}
  - name: "lighting"
    type: "continuous"
    distribution: "uniform"
    params: {low: 0.5, high: 1.5}

# Structural variables (invariant)
structural_variables:
  - name: "shape"
    type: "categorical"
    values: ["circle", "square", "triangle"]
  - name: "size"
    type: "continuous"
    distribution: "uniform"
    params: {low: 0.3, high: 1.0}

# Outcome variable (Y)
outcome:
  name: "class_label"
  type: "categorical"
  determined_by: ["shape"]  # Only structural variables determine outcome
  mapping:
    "circle": 0
    "square": 1
    "triangle": 2

# Intervention targets
intervention_targets:
  - "style"
  - "identity"
  - "background_noise"
  - "lighting"

# OOD test splits
ood_splits:
  - name: "unseen_style"
    holdout: ["style_c"]
  - name: "unseen_identity"
    holdout: ["id_5"]
  - name: "unseen_combination"
    holdout: [["style_c", "id_5"]]